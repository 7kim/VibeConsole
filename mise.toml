# VibeConsole's tools and tasks (v7.7 ticket 263).
# `mise install` installs only the tools below: nothing builds, installs or restarts
# VibeConsole until you run a task (`mise run install`, `mise run check`, `mise run pty`).

# mise ticket 09: the mise these tasks were built and tested with; an older one warns.
min_version = { soft = "2026.8.10" }

[tools]
# mise installs Rust through rustup (~/.rustup, ~/.cargo) and pins this toolchain here.
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# uv runs the Python checks; each script names its Python in a PEP 723 header.
uv = "0.13.8"

[tasks.install]
description = "Build the release binary, stop VibeConsole, install it, start the login service again"
run = "scripts/install.sh"

[tasks.pty]
description = "Debug build, then the isolated PTY, installation and emulator checks (Python through uv)"
run = [
  "scripts/needs-bwrap.sh",
  "cargo build --locked",
  "uv run scripts/check-terminal.py",
  "uv run scripts/check-installation.py",
  "uv run scripts/emulate/check-akai.py",
  "uv run scripts/emulate/check-xbox.py",
]

[tasks.check]
description = "cargo-gate when it is installed (else fmt, check and test), then the PTY checks"
run = [
  "if command -v cargo-gate >/dev/null; then cargo-gate; else cargo fmt --check && cargo check --locked && cargo test --locked; fi",
  "mise run pty",
]

[tasks.idle]
description = "Release build, then its idle CPU and terminal bytes over 10 s (name two binaries to compare)"
# mise ticket 04. Arguments go to the last entry: `mise run idle <before> <after>`.
run = [
  "scripts/needs-bwrap.sh",
  "cargo build --release --locked",
  "uv run scripts/check-idle.py",
]

[tasks.appimage]
description = "AppImage of the committed HEAD into target/appimage/, then an Arch container check (args: [label] [--no-arch])"
# v7.8 tickets 61–62. `mise run appimage preview.2` names the build; publishing is separate.
run = "scripts/appimage.sh"

[tasks.config-isolation]
description = "The test suite against a sentinel config: reports reads and any write (--each: each test alone)"
# mise ticket 05. `mise run config-isolation --each` passes --each to the script.
run = "scripts/check-config-isolation.sh"

[tasks.logs]
description = "Today's VibeConsole journal: the login service, its Started/Stopped lines and every terminal run (extra arguments go to journalctl)"
# mise ticket 06. -t and -u together would be ANDed and drop terminal-run and systemd lines;
# the + makes the two matches an OR.
run = "journalctl --user --since today SYSLOG_IDENTIFIER=vibeconsole + USER_UNIT=vibeconsole.service"

[tasks.doctor]
description = "Read-only: vibeconsole doctor, startup-status and the login service's run state, in one call"
# mise ticket 07. Each part runs even when one fails; the exit status is the first failure's.
shell = "bash -c"
run = '''
first=0
part() { echo "== $1"; shift; s=0; "$@" || s=$?; if [ "$first" = 0 ]; then first=$s; fi; echo; }
part "vibeconsole doctor" vibeconsole doctor
part "vibeconsole startup-status" vibeconsole startup-status
echo "== login service run state"
state="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/vibeconsole/run-state"
if [ -f "$state" ]; then cat "$state"; else echo "no run state: the login service isn't running"; fi
exit "$first"
'''

[tasks.all]
description = "Every check before a version ends: check (cargo-gate, pty), config-isolation, idle; stops at the first failure"
# mise ticket 08. Each step keeps its own isolation; this adds none.
run = [
  "mise run check",
  "mise run config-isolation",
  "mise run idle",
]
